function explorerTable(name, records) {

    return { key: k, label: k.indexOf('properties.') === 0 ? k.slice(11) : k, num: numeric, get: function (f) { return f[k]; } };
  });
  return dataTable(cols, flat, { csvName: 'waypoint-' + name, pageSize: 50, onRow: function (f) { openDrawer(name, [{ title: 'Record', value: records[flat.indexOf(f)] }]); } });
}
