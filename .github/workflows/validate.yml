name: Validate PowerShell

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Parse, lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 220 | Write-Host
          $errors = @($findings | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "$($errors.Count) PSScriptAnalyzer error(s)." }

  waypoint-template:
    name: Waypoint report template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/waypoint/package-lock.json

      - name: Install dependencies
        working-directory: tests/waypoint
        run: npm ci

      - name: Render the report against the sample export
        working-directory: tests/waypoint
        run: npm test
